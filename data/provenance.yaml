checked:
  note: scripts/02_verify.py, with Python's zipfile, json and its own DBF/SHP/WKB readers, and DuckDB, before upload
  items:
    - every raw file against MANIFEST.json (size and sha256); every zip and the xlsx pass testzip; the PDFs are PDFs
    - every Shapefile has .dbf, .shx, .prj and a .cpg saying UTF-8; .shx records equal the DBF header
    - every GeoJSON zip holds the same 8,173 files as the Shapefile zips, with the same feature counts, CRS EPSG:6668
    - every layer's Parquet has its DBFs' rows (424,335 in all), in their order, columns and types as the rules give
    - all 4,967,475 attribute values equal the DBFs, read as strict UTF-8 without GDAL
    - every geometry has the x, y bytes of its .shp record, part by part; null shapes are NULL
    - Citycode equals the code in the file name in every row
    - GeoParquet 1.0.0 metadata states EPSG:6668; a DuckDB without extensions opens each file; no bloom filters

modifications:
  raw: none. MLIT's files, byte for byte; the two HTML pages as fetched.
  parquet:
    - all Shapefiles of a layer, from all 47 prefecture zips, in one file per layer
    - source_file (path in the zip) and fid (record number from 0) added; rows sorted by them
    - types from column names (…Code INTEGER, FAR and BCR DOUBLE, else VARCHAR), each cast guarded; '*'-filled numeric DBF fields, the DBF null, are NULL
    - geometry as read by GDAL from the .shp, EPSG:6668, not reprojected
    - written with zstd, row groups of 100,000, without bloom filters
  not_converted: GeoJSON (same features as the Shapefiles), CityGML (a different model), documents
