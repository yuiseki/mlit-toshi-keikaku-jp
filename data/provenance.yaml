update_pattern: |
  One edition on the pages at a time (データ作成年度). Corrections replace zips
  in place, noted beside them in the download table; the Shapefile and
  CityGML zips keep their URLs, the GeoJSON zips got new ones. shp/13_tokyo.zip
  was replaced again on 17 July 2026 without an entry in the history. Earlier
  editions are not online. Here an edition is a directory; within it the
  files follow the source (01_download.py --refresh).

